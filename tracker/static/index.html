<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Study Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>LeetCode Study Tracker</h1>
  <nav id="tabs">
    <button data-tab="today" class="active">Today <span id="due-count" class="count"></span></button>
    <button data-tab="browse">Browse</button>
    <button data-tab="drill">Drill</button>
    <button data-tab="stats">Stats</button>
  </nav>
  <label class="cap">Rating cap
    <select id="cap-select">
      <option>1400</option><option>1500</option><option>1600</option>
      <option selected>1700</option><option>1800</option><option>2000</option>
      <option>2200</option><option>2400</option><option value="none">none</option>
    </select>
  </label>
  <button id="settings-btn" class="iconbtn" title="Sync folder / settings">⚙</button>
</header>

<dialog id="settings-dlg">
  <form method="dialog" class="dlg">
    <h2>Sync folder</h2>
    <p class="sub">Your progress (reviews + review schedule) is stored in this folder. Point it
      at a <b>Dropbox</b>, <b>iCloud Drive</b>, or <b>OneDrive</b> folder to sync across
      machines. Switching to a folder that already has history merges the two — nothing is
      lost either way.</p>
    <p class="pathbox"><span id="cur-data-dir" class="path">…</span></p>
    <div class="dlg-row">
      <button type="button" id="choose-folder">Choose folder…</button>
      <span class="sub" id="picker-hint"></span>
    </div>
    <div class="dlg-row">
      <input id="manual-path" type="text" placeholder="…or paste a folder path">
      <button type="button" id="set-path">Set</button>
    </div>
    <p id="sync-msg" class="sub"></p>
    <menu class="dlg-menu"><button value="close">Close</button></menu>
  </form>
</dialog>
<main>
  <section id="view-today"></section>

  <section id="view-browse" hidden>
    <div id="filters">
      <select id="f-list">
        <option value="all">All lists</option>
        <option value="hot100">Hot 100</option>
        <option value="interview150">Interview 150</option>
        <option value="neetcode250">NeetCode 250</option>
        <option value="ox3f">0x3F</option>
      </select>
      <select id="f-topic" hidden><option value="">All topics</option></select>
      <select id="f-diff">
        <option value="">Any difficulty</option>
        <option>Easy</option><option>Medium</option><option>Hard</option>
      </select>
      <select id="f-status">
        <option value="">Any status</option>
        <option value="new">New</option>
        <option value="solved">Scheduled</option>
        <option value="due">Due</option>
        <option value="forgotten">Forgotten</option>
        <option value="mastered">Mastered</option>
      </select>
      <input id="f-search" type="search" placeholder="Search title or #id">
      <select id="f-sort">
        <option value="id">Sort: ID</option>
        <option value="rating">Sort: Rating</option>
        <option value="due">Sort: Due date</option>
      </select>
      <label><input type="checkbox" id="f-cap"> &le; cap</label>
      <label id="comp-label" hidden><input type="checkbox" id="f-comp"> competition tier</label>
    </div>
    <div id="browse-table"></div>
    <div id="pager"></div>
  </section>

  <section id="view-drill" hidden></section>

  <section id="view-stats" hidden></section>
</main>
<script src="curriculum.js"></script>
<script src="route.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
